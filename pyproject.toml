[project]
name = "metal-gauss"
version = "0.2.1"
description = "Differentiable 3D Gaussian Splatting rasterizer, Metal-native. No CUDA anywhere."
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
keywords = ["gaussian-splatting", "3dgs", "metal", "apple-silicon", "mps", "radiance-fields"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
# pillow and scipy are not optional despite being imported lazily: every scene
# loader decodes images through PIL, and init_params() -- which train() calls
# unconditionally -- needs scipy.spatial.cKDTree for the knn scale init. With
# them in an extra, `pip install metal-gauss && metal-gauss-train` failed at
# the first scene it was pointed at, which is the only thing the console
# scripts this package declares are for. pycolmap stays optional: it is needed
# only for COLMAP scenes, and Blender scenes never touch it.
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "plyfile>=1.0",
    "ninja>=1.11",
    "pillow>=10.0",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/nandometzger/metal-gauss"
Source = "https://github.com/nandometzger/metal-gauss"
"Measured rejections" = "https://github.com/nandometzger/metal-gauss/blob/main/bench/results/NEGATIVE_RESULTS.md"

[project.scripts]
metal-gauss-train = "metal_gauss.train:main"
metal-gauss-render = "metal_gauss.render_path:main"
metal-gauss-view = "metal_gauss.viewer:main"

[project.optional-dependencies]
bench = ["pycolmap>=3.10"]
train = ["pycolmap>=3.10"]      # pillow/scipy moved to core; kept for compatibility
test = ["pytest>=8.0"]
viewer = ["viser>=1.1,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metal_gauss"]

# Without this the sdist is 19.5 MB, because hatchling defaults to shipping the
# working tree: assets/ is 15 MB of gifs and an mp4, bench/ another 6.4 MB of
# published results. None of it is needed to build, install or test the
# package, and PyPI is not a CDN for a teaser video. The wheel was always lean
# (120 KB) since it only ever carried the package directory.
[tool.hatch.build.targets.sdist]
include = [
    "metal_gauss",
    "tests",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]
